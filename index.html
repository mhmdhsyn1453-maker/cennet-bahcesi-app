    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent aggressive disk caching of index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cennetbahcesi.org/" />
    <meta property="og:title" content="Cennet Bahçesi - Yaz Kur'an Kursu Portalı" />
    <meta property="og:description" content="Yaz Kur'an Kursları için eğlenceli, interaktif ve eğitici oyunlar portalı. Hemen oyna!" />
    <meta property="og:image" content="https://cennetbahcesi.org/og-image.png" />

    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cennetbahcesi.org/" />
    <meta property="twitter:title" content="Cennet Bahçesi - Yaz Kur'an Kursu Portalı" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Get the base path dynamically (e.g. '/' or '/cennet-bahcesi-app/')
          const base = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          navigator.serviceWorker.register(base + 'sw.js')
            .then(reg => {
              console.log('ServiceWorker registered:', reg.scope);
              // Sayfa açıldığında ve her 10 dakikada bir güncelleme kontrolü yap
              reg.update();
              setInterval(() => reg.update(), 10 * 60 * 1000);
            })
            .catch(err => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
